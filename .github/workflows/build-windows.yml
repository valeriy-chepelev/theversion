name: Build Windows EXE (onedir)

on:
  push:
    tags:
      - 'v*'          # запуск при пуше тега вида v1.0.0
  workflow_dispatch:   # возможность запустить вручную из вкладки Actions

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with flet pack (onedir)
        run: |
          flet pack src/theversion/theversion.py `
            --name TheVersion `
            --onedir `
            --icon assets/theversion.ico `
            --distpath dist `
            --product-name "The Version" `
            -y
        

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheVersion-Windows
          path: dist/TheVersion/
          if-no-files-found: error