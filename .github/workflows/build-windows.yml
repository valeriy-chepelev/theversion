name: Build Windows EXE (onedir)

on:
  push:
    tags:
      - 'v*'          # запуск при пуше тега вида v1.0.0
  workflow_dispatch:   # возможность запустить вручную из вкладки Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with flet pack (onedir)
        run: |
          flet pack src/theversion/theversion.py `
            --name TheVersion `
            --onedir `
            --icon assets/theversion.ico `
            --product-name "The Version" `
            --company-name "Valeriy Chepelev" `
            --copyright "Copyright (c) 2026 Valeriy Chepelev" `
            --file-version 0.1.0.0 `
            --product-version 0.1.0.0 `
            --distpath dist `
            -y

      - name: Copy example ini next to exe
        run: Copy-Item src/theversion/theversion.ini.example dist/TheVersion/theversion.ini

      - name: Zip for release
        run: Compress-Archive -Path dist/TheVersion/* -DestinationPath dist/TheVersion.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheVersion-Windows
          path: dist/TheVersion/

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TheVersion.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}