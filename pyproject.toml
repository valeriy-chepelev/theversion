[project]
name = "theversion"
dynamic = ["version"]
description = "Versions synchronizer for Yandex Tracker"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Valeriy Chepelev"},
]
dependencies = [
    "flet",
    "yandex-tracker-client",
    "natsort",
]

[tool.setuptools.dynamic]
version = { attr = "theversion._version.__version__" }